<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creaciones Personalizadas - Catálogo y Pedidos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Comfortaa y Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        brand: ['Comfortaa', 'cursive'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            pink: '#FFA3D7',
                            pinkLight: '#FFF0F7',
                            pinkDark: '#E573B3',
                            yellow: '#FFF3B3',
                            yellowDark: '#F4D35E',
                            cream: '#FFFDF9',
                            text: '#5A3E4E',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #FFFDF9; color: #5A3E4E; }
    </style>
</head>
<body class="min-h-full flex flex-col font-sans antialiased selection:bg-pastel-pink/30 selection:text-pastel-text">

    <!-- Encabezado con Logo y Nombre -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-30 border-b border-pastel-pink/20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
            
            <!-- Logo y Marca -->
            <div class="flex items-center space-x-3 sm:space-x-4">
                <div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-pastel-pinkLight p-1 border-2 border-pastel-yellow shadow-sm flex items-center justify-center overflow-hidden flex-shrink-0">
                    <img src="Creaciones.png" alt="Creaciones Personalizadas Logo" onerror="this.src='https://placehold.co/200x200/FFA3D7/5A3E4E?text=CP'" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="font-brand font-bold text-xl sm:text-2xl text-pastel-text tracking-tight">Creaciones Personalizadas</h1>
                    <p class="text-xs sm:text-sm text-pink-500 font-medium flex items-center">
                        <i class="fa-solid fa-heart text-xs mr-1"></i> Detalles únicos hechos con amor
                    </p>
                </div>
            </div>

            <!-- Botones de Acción Header -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Botón Admin Oculto/Discreto -->
                <button onclick="promptAdminPassword()" title="Administrar catálogo" class="p-2 sm:px-3 sm:py-2 rounded-xl text-xs font-semibold text-pastel-text bg-pastel-pinkLight hover:bg-pastel-pink/20 border border-pastel-pink/30 transition-all">
                    <i class="fa-solid fa-lock text-pastel-pinkDark"></i>
                    <span class="hidden md:inline ml-1.5">Admin</span>
                </button>

                <!-- Botón Carrito de Compras -->
                <button onclick="toggleCartModal()" class="relative bg-pastel-pink text-white px-4 py-2.5 rounded-2xl font-bold text-sm shadow-md hover:bg-pastel-pinkDark transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-basket-shopping text-base"></i>
                    <span class="hidden sm:inline">Mi Pedido</span>
                    <span id="cartCountBadge" class="bg-pastel-yellow text-pastel-text text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>
